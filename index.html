    <!-- ==================================================
         AUDIO MUTE
         Phải chạy trước khi tải Pygbag.
         ================================================== -->
    <script>
    (() => {
        "use strict";

        // 1. Chặn Web Audio bằng GainNode có gain = 0.
        // Không sửa buffer âm thanh, không thay callback SDL2.
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (AudioContextClass && window.AudioNode) {
            const nodeProto = window.AudioNode.prototype;

            if (!nodeProto.__webGameMuteInstalled) {
                const originalConnect = nodeProto.connect;

                Object.defineProperty(
                    nodeProto,
                    "__webGameMuteInstalled",
                    { value: true }
                );

                nodeProto.connect = function (
                    destination,
                    ...args
                ) {
                    try {
                        const context = this.context;

                        if (
                            context &&
                            destination === context.destination &&
                            typeof context.createGain === "function"
                        ) {
                            const muteGain = context.createGain();
                            muteGain.gain.value = 0;

                            originalConnect.call(
                                this,
                                muteGain,
                                ...args
                            );

                            originalConnect.call(
                                muteGain,
                                destination
                            );

                            return muteGain;
                        }
                    } catch (error) {
                        console.warn(
                            "[GameMute] Web Audio hook error:",
                            error
                        );
                    }

                    return originalConnect.call(
                        this,
                        destination,
                        ...args
                    );
                };
            }
        }

        // 2. Tắt các thẻ audio/video.
        function muteMedia(element) {
            if (!element || !element.tagName) return;

            const tag = element.tagName.toUpperCase();

            if (tag === "AUDIO" || tag === "VIDEO") {
                element.muted = true;
                element.defaultMuted = true;
                element.volume = 0;
            }
        }

        function scanMedia(root) {
            if (!root) return;

            muteMedia(root);

            if (typeof root.querySelectorAll === "function") {
                root.querySelectorAll("audio, video")
                    .forEach(muteMedia);
            }
        }

        function installMediaMute() {
            scanMedia(document);

            if (!document.documentElement) return;

            const observer = new MutationObserver((mutations) => {
                for (const mutation of mutations) {
                    for (const node of mutation.addedNodes) {
                        scanMedia(node);
                    }

                    if (
                        mutation.type === "attributes" &&
                        mutation.target
                    ) {
                        muteMedia(mutation.target);
                    }
                }
            });

            observer.observe(document.documentElement, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ["src", "autoplay"]
            });

            // Giữ observer tồn tại trong suốt phiên chơi.
            window.__gameMuteObserver = observer;
        }

        if (document.readyState === "loading") {
            document.addEventListener(
                "DOMContentLoaded",
                installMediaMute,
                { once: true }
            );
        } else {
            installMediaMute();
        }

        document.addEventListener("play", (event) => {
            muteMedia(event.target);
        }, true);

        console.info("[GameMute] Mute hooks installed.");
    })();
    </script>

import sys
import asyncio
import platform
import json
from pathlib import Path

async def custom_site():
    import embed

    platform.document.body.style.background = "#000000"

    platform.window.transfer.hidden = True
    platform.window.canvas.style.visibility = "visible"

    bundle = "web_game"
    appdir = Path(f"/data/data/{bundle}")
    appdir.mkdir(parents=True, exist_ok=True)

    if ".itch.zone" in platform.window.location.host:
        import zipfile

        async with platform.fopen("web_game.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile

        async with platform.fopen("web_game.tar.gz", "rb") as archive:
            with tarfile.open(
                fileobj=archive,
                mode="r:gz"
            ) as tar:
                tar.extractall(
                    path=appdir.as_posix(),
                    filter="tar"
                )

    platform.run_main(
        PyConfig,
        loaderhome=appdir / "assets",
        loadermain=None
    )

    while embed.counter() < 0:
        await asyncio.sleep(0.1)

    main = appdir / "assets" / "main.py"

    if not platform.window.MM.UME:
        __import__(__name__).__file__ = main

        msg = "Ready to start! Please click/touch page"
        platform.window.infobox.innerText = msg

        print("\n" * 4, f"* {msg} *", "\n" * 4)

        while not platform.window.MM.UME:
            await asyncio.sleep(0.1)

    await TopLevel_async_handler.start_toplevel(
        platform.shell,
        console=window.python.config.debug
    )

    __import__(__name__).__file__ = main

    def ui_callback(pkg):
        platform.window.infobox.innerText = f"Installing {pkg}"

    await shell.source(main, callback=ui_callback)

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()

    print("default.tmpl: done")
    shell.interactive()

asyncio.run(custom_site())

            fb_ar: 16 / 9,
            fb_width: "1280",
            fb_height: "720"
        };

        function show_infobox() {
            const infobox = document.getElementById("infobox");
            if (!infobox) return;

            infobox.style.display = "block";

            const width = infobox.offsetWidth;
            const height = infobox.offsetHeight;

            infobox.style.left =
                (window.innerWidth - width) / 2 + "px";

            infobox.style.top =
                (window.innerHeight - height) / 2 + "px";
        }
    </script>

    <script>
        globalThis.__canvas_resized = (self, ecw, ech) => {
            console.warn(
                "TODO: panda3d canvas monitor",
                self,
                ecw,
                ech
            );
        };

        async function custom_onload(debug_hidden) {
            if (typeof pyconsole !== "undefined") {
                pyconsole.hidden = debug_hidden;
            }

            if (typeof system !== "undefined") {
                system.hidden = debug_hidden;
            }

            if (typeof info !== "undefined") {
                info.hidden = debug_hidden;
            }

            if (typeof box !== "undefined") {
                box.hidden = debug_hidden;
            }

            show_infobox();
        }

        function custom_prerun() {
            console.log(__FILE__, "custom_prerun");
        }

        function custom_postrun() {
            console.log(__FILE__, "custom_postrun");
        }

        function debug() {
            python.config.debug = true;
            custom_onload(false);
            Module.PyRun_SimpleString("shell.uptime()");
            window_resize();
        }

        function info_inline(data) {
            document.getElementById("info").innerHTML = data;
        }

        function info_online(url) {
            fetch(url)
                .then((response) => response.text())
                .then(info_inline)
                .catch((error) => console.warn(error));
        }

        function frame_online(url) {
            window.frames["iframe"].location = url;
        }

        window.addEventListener("resize", show_infobox);
    </script>
